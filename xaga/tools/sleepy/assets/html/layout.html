  var saved = localStorage.getItem('theme');
  var prefers = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (saved ? saved === 'dark' : prefers) document.documentElement.classList.add('dark');
})();
</script>

};
</script>

<style>
[v-cloak] { display: none !important; }
html { transition: background-color 0.2s ease, color 0.2s ease; }
.prose :where(pre):not(:where([class~="not-prose"] *)) {
  position: relative;
  background-color: rgb(249 250 251);
  border: 1px solid rgb(229 231 235);
  margin: 1.25rem 0;
  padding: 1rem;
  border-radius: 0.5rem;
  overflow-x: auto;
  font-size: 0.875rem;
  line-height: 1.6;
}
html.dark .prose :where(pre):not(:where([class~="not-prose"] *)) {
  background-color: rgb(15 23 42);
  border-color: rgb(31 41 55);
}
.prose :where(pre code):not(:where([class~="not-prose"] *)) {
  background: transparent;
  padding: 0;
  font-size: inherit;
  font-weight: 400;
}
.prose :where(code):not(:where([class~="not-prose"] *)) {
  background-color: rgb(241 245 249);
  color: rgb(190 24 93);
}
html.dark .prose :where(code):not(:where([class~="not-prose"] *)) {
  background-color: rgb(30 41 59);
  color: rgb(244 114 182);
}
.prose :where(a):not(:where([class~="not-prose"] *)) {
  color: rgb(79 70 229);
  text-decoration: none;
  font-weight: 500;
}
html.dark .prose :where(a):not(:where([class~="not-prose"] *)) {
  color: rgb(165 180 252);
}
.prose :where(a):not(:where([class~="not-prose"] *)):hover {
  text-decoration: underline;
}
.prose :where(table):not(:where([class~="not-prose"] *)) {
  width: 100%;
  display: block;
  overflow-x: auto;
  font-size: 0.875rem;
}
.prose :where(h2):not(:where([class~="not-prose"] *)) {
  margin-top: 2rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid rgb(229 231 235);
}
html.dark .prose :where(h2):not(:where([class~="not-prose"] *)) {
  border-color: rgb(31 41 55);
}
.prose :where(blockquote):not(:where([class~="not-prose"] *)) {
  border-left-color: rgb(99 102 241);
  font-style: normal;
  font-weight: 500;
}
.code-copy-btn {
  position: absolute;
  top: 0.5rem;
  right: 0.5rem;
  padding: 0.25rem 0.5rem;
  font-size: 0.75rem;
  line-height: 1;
  border-radius: 0.375rem;
  background-color: rgb(241 245 249);
  color: rgb(71 85 105);
  border: 1px solid rgb(229 231 235);
  opacity: 0;
  transition: opacity 0.15s ease, background-color 0.15s ease;
  cursor: pointer;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
}
html.dark .code-copy-btn {
  background-color: rgb(30 41 59);
  color: rgb(203 213 225);
  border-color: rgb(51 65 85);
}
pre:hover > .code-copy-btn { opacity: 1; }
.code-copy-btn:hover { background-color: rgb(226 232 240); }
html.dark .code-copy-btn:hover { background-color: rgb(51 65 85); }
.code-copy-btn.copied { background-color: rgb(220 252 231); color: rgb(22 101 52); border-color: rgb(187 247 208); }
html.dark .code-copy-btn.copied { background-color: rgb(20 83 45); color: rgb(187 247 208); border-color: rgb(22 101 52); }
</style>
</head>

<script>
function syncHljsTheme(isDark) {
  var lightLink = document.getElementById('hljs-light');
  var darkLink = document.getElementById('hljs-dark');
  if (lightLink) lightLink.disabled = isDark;
  if (darkLink) darkLink.disabled = !isDark;
}
syncHljsTheme(document.documentElement.classList.contains('dark'));

function highlightAll(scope) {
  (scope || document).querySelectorAll('pre code').forEach(function (block) {
    if (block.dataset.hljsDone === '1') return;
    block.dataset.hljsDone = '1';
    try { hljs.highlightElement(block); } catch (e) {}
    var pre = block.parentElement;
    if (pre && pre.tagName === 'PRE' && !pre.querySelector('.code-copy-btn')) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'code-copy-btn';
      btn.textContent = '复制';
      btn.addEventListener('click', function () {
        var text = block.textContent;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            btn.textContent = '已复制';
            btn.classList.add('copied');
            setTimeout(function () { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
          });
        } else {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); btn.textContent = '已复制'; btn.classList.add('copied'); setTimeout(function () { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500); } catch (e2) {}
          document.body.removeChild(ta);
        }
      });
      pre.appendChild(btn);
    }
  });
}

var { createApp, ref, computed, watch, onMounted, onBeforeUnmount, nextTick } = Vue;
var app = createApp({
  setup() {
    var isDark = ref(document.documentElement.classList.contains('dark'));
    var mobileOpen = ref(false);
    var showBackTop = ref(false);
    var activePath = (location.pathname.split('/').pop() || 'index.html').toLowerCase();

    var dataEl = document.getElementById('docs-json');
    var allDocs = ref([]);
    try {
      if (dataEl && dataEl.textContent.trim()) {
        allDocs.value = JSON.parse(dataEl.textContent) || [];
      }
    } catch (e) {}

    var searchOpen = ref(false);
    var searchQuery = ref('');
    var activeIdx = ref(0);
    var searchInput = ref(null);

    var filteredDocs = computed(function () {
      var q = searchQuery.value.trim().toLowerCase();
      if (!q) return allDocs.value;
      return allDocs.value.filter(function (d) {
        return (d.title && String(d.title).toLowerCase().indexOf(q) !== -1) ||
               (d.filename && String(d.filename).toLowerCase().indexOf(q) !== -1);
      });
    });

    function openSearch() {
      searchOpen.value = true;
      activeIdx.value = 0;
      searchQuery.value = '';
      nextTick(function () { if (searchInput.value) searchInput.value.focus(); });
      document.documentElement.style.overflow = 'hidden';
    }
    function closeSearch() {
      searchOpen.value = false;
      document.documentElement.style.overflow = '';
    }
    function moveDown() {
      if (filteredDocs.value.length === 0) return;
      activeIdx.value = (activeIdx.value + 1) % filteredDocs.value.length;
    }
    function moveUp() {
      if (filteredDocs.value.length === 0) return;
      activeIdx.value = (activeIdx.value - 1 + filteredDocs.value.length) % filteredDocs.value.length;
    }
    function gotoActive() {
      var list = filteredDocs.value;
      if (list.length === 0) return;
      var doc = list[activeIdx.value] || list[0];
      gotoDoc(doc);
    }
    function gotoDoc(doc) {
      if (!doc || !doc.filename) return;
      location.href = doc.filename + '.html';
    }

    watch(searchQuery, function () { activeIdx.value = 0; });

    function applyTheme(v) {
      document.documentElement.classList.toggle('dark', v);
      localStorage.setItem('theme', v ? 'dark' : 'light');
      syncHljsTheme(v);
    }
    function toggleTheme() { isDark.value = !isDark.value; applyTheme(isDark.value); }
    function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
    function onScroll() { showBackTop.value = window.scrollY > 400; }

    function onGlobalKey(e) {
      if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
        e.preventDefault();
        if (searchOpen.value) closeSearch(); else openSearch();
        return;
      }
      if (e.key === 'Escape' && searchOpen.value) { e.preventDefault(); closeSearch(); }
      if (e.key === '/' && !searchOpen.value) {
        var t = e.target && e.target.tagName;
        if (t !== 'INPUT' && t !== 'TEXTAREA') { e.preventDefault(); openSearch(); }
      }
    }

    onMounted(function () {
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('keydown', onGlobalKey);
      onScroll();
      nextTick(function () { highlightAll(document.querySelector('main')); });
      if ('MutationObserver' in window) {
        var mo = new MutationObserver(function (muts) {
          for (var i = 0; i < muts.length; i++) {
            if (muts[i].addedNodes && muts[i].addedNodes.length) {
              for (var j = 0; j < muts[i].addedNodes.length; j++) {
                var n = muts[i].addedNodes[j];
                if (n.nodeType === 1 && (n.tagName === 'PRE' || (n.querySelector && n.querySelector('pre code')))) {
                  highlightAll(n);
                }
              }
            }
          }
        });
        var main = document.querySelector('main');
        if (main) mo.observe(main, { childList: true, subtree: true });
      }
    });
    onBeforeUnmount(function () {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('keydown', onGlobalKey);
    });

    return {
      isDark: isDark, mobileOpen: mobileOpen, showBackTop: showBackTop, activePath: activePath,
      toggleTheme: toggleTheme, scrollToTop: scrollToTop,
      allDocs: allDocs, searchOpen: searchOpen, searchQuery: searchQuery, activeIdx: activeIdx,
      searchInput: searchInput, filteredDocs: filteredDocs,
      openSearch: openSearch, closeSearch: closeSearch, moveDown: moveDown, moveUp: moveUp,
      gotoActive: gotoActive, gotoDoc: gotoDoc
    };
  }
});
