{% extends "layout.html" %}
{% block docs_json %}<script type="application/json" id="docs-json">{{ docs | json_encode | safe }}</script>{% endblock %}
{% block content %}
<article class="space-y-6">
<nav class="text-sm text-slate-500 dark:text-slate-400" aria-label="breadcrumb">
<ol class="flex items-center gap-2 flex-wrap">
<li><a href="index.html" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition">首页</a></li>
<li aria-hidden="true">/</li>
<li><a href="reference.html" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition">参考</a></li>
<li aria-hidden="true">/</li>
<li class="text-slate-700 dark:text-slate-300 font-medium truncate max-w-[40ch]">{{ title }}</li>
</ol>
</nav>
<header class="border-b border-slate-200 dark:border-slate-800 pb-6 space-y-3">
<h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-slate-900 dark:text-white">{{ title }}</h1>
{% if path %}
<div class="flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400">
<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
</svg>
<code class="font-mono text-xs sm:text-sm break-all text-slate-600 dark:text-slate-400">{{ path }}</code>
</div>
{% endif %}
</header>
<div v-pre class="prose prose-slate dark:prose-invert max-w-none prose-headings:scroll-mt-20 prose-pre:my-0">{{ body | safe }}</div>
</article>
{% endblock %}
